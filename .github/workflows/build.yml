name: Build Wraith installers

# Builds the Windows (.exe/NSIS), Linux (.deb) and macOS (.dmg) installers
# on their native OS runners (cross-building a proper NSIS/dmg from Linux
# isn't reliable, so we let GitHub's hosted runners do each one natively)
# and attaches them to a GitHub Release whenever a version tag is pushed.
#
# Usage: bump "version" in app/package.json, then
#   git tag v1.0.0 && git push origin v1.0.0
# The website's "Download" buttons read this repo's latest Release via
# the GitHub API, so publishing a release here is what makes them work.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wraith-${{ matrix.os }}
          path: |
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
